<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0a0d14; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="680" fill="url(#bgGlow)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="150" y1="0" x2="150" y2="680"/>
    <line x1="300" y1="0" x2="300" y2="680"/>
    <line x1="450" y1="0" x2="450" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="750" y1="0" x2="750" y2="680"/>
    <line x1="900" y1="0" x2="900" y2="680"/>
    <line x1="1050" y1="0" x2="1050" y2="680"/>
  </g>

  <!-- Title & Header Badge -->
  <g transform="translate(60, 42)">
    <rect x="0" y="-12" width="1080" height="42" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>
    <text x="20" y="16" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="1">RIVA : AI-ASSISTED RTL BUG DETECTION &amp; CLOSED-LOOP AUTO-REPAIR FRAMEWORK</text>
    <rect x="910" y="-4" width="150" height="26" rx="13" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
    <text x="985" y="13" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">IEEE 1800 Compliant</text>
  </g>

  <!-- ==================== COLUMN 1: INPUT STAGE ==================== -->
  <g transform="translate(60, 110)">
    <!-- Stage Header -->
    <rect x="0" y="0" width="180" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="20" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">1. DESIGN INPUTS</text>

    <!-- Card 1: RTL Source -->
    <g transform="translate(0, 45)" filter="url(#shadow)">
      <rect x="0" y="0" width="180" height="95" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#0284c7" fill-opacity="0.2"/>
      <text x="26" y="31" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">SV</text>
      <text x="50" y="26" fill="#f1f5f9" font-size="13" font-weight="600">RTL Source</text>
      <text x="50" y="42" fill="#94a3b8" font-size="11">SystemVerilog / V</text>
      <path d="M 12 55 L 168 55" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="72" fill="#64748b" font-size="10">• Modules, Ports, Nets</text>
      <text x="12" y="86" fill="#64748b" font-size="10">• Always blocks &amp; FSMs</text>
    </g>

    <!-- Card 2: Specifications -->
    <g transform="translate(0, 155)" filter="url(#shadow)">
      <rect x="0" y="0" width="180" height="95" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="26" y="31" fill="#a855f7" font-size="14" font-weight="bold" text-anchor="middle">SP</text>
      <text x="50" y="26" fill="#f1f5f9" font-size="13" font-weight="600">Design Specs</text>
      <text x="50" y="42" fill="#94a3b8" font-size="11">Markdown / Req Text</text>
      <path d="M 12 55 L 168 55" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="72" fill="#64748b" font-size="10">• REQ tags &amp; contracts</text>
      <text x="12" y="86" fill="#64748b" font-size="10">• Temporal properties</text>
    </g>

    <!-- Card 3: Testbench & Waveform -->
    <g transform="translate(0, 265)" filter="url(#shadow)">
      <rect x="0" y="0" width="180" height="95" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="#10b981" fill-opacity="0.2"/>
      <text x="26" y="31" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">TB</text>
      <text x="50" y="26" fill="#f1f5f9" font-size="13" font-weight="600">Verification TB</text>
      <text x="50" y="42" fill="#94a3b8" font-size="11">VCD Waveform Trace</text>
      <path d="M 12 55 L 168 55" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="72" fill="#64748b" font-size="10">• Simulation stim &amp; clocks</text>
      <text x="12" y="86" fill="#64748b" font-size="10">• Transition edge logs</text>
    </g>
  </g>

  <!-- Arrow: Col 1 -> Col 2 -->
  <path d="M 240 200 L 285 200" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>
  <path d="M 240 310 L 285 310" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>
  <path d="M 240 420 L 285 420" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>

  <!-- ==================== COLUMN 2: DETERMINISTIC CORE ==================== -->
  <g transform="translate(290, 110)">
    <!-- Stage Header -->
    <rect x="0" y="0" width="200" height="30" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="100" y="20" fill="#06b6d4" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">2. PARSER &amp; ELABORATOR</text>

    <g transform="translate(0, 45)" filter="url(#shadow)">
      <rect x="0" y="0" width="200" height="315" rx="8" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.2"/>
      
      <!-- Box 1: Lexer & AST -->
      <rect x="12" y="14" width="176" height="58" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="22" y="34" fill="#38bdf8" font-size="12" font-weight="700">Lexer &amp; AST Engine</text>
      <text x="22" y="52" fill="#94a3b8" font-size="10">SystemVerilog Token Stream ➔ AST</text>

      <!-- Box 2: Elaboration -->
      <rect x="12" y="84" width="176" height="66" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="22" y="104" fill="#38bdf8" font-size="12" font-weight="700">Hierarchical Netlist</text>
      <text x="22" y="122" fill="#94a3b8" font-size="10">Parameters, Generate Blocks,</text>
      <text x="22" y="136" fill="#94a3b8" font-size="10">Port Binding &amp; Scope Resolver</text>

      <!-- Box 3: Semantics & Type -->
      <rect x="12" y="162" width="176" height="66" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="22" y="182" fill="#38bdf8" font-size="12" font-weight="700">Width &amp; Type Inference</text>
      <text x="22" y="200" fill="#94a3b8" font-size="10">Bit-width sizing, signedness rule,</text>
      <text x="22" y="214" fill="#94a3b8" font-size="10">Packed &amp; Unpacked dimensions</text>

      <!-- Box 4: CFG & Dataflow -->
      <rect x="12" y="240" width="176" height="62" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="22" y="260" fill="#38bdf8" font-size="12" font-weight="700">CFG &amp; Liveness</text>
      <text x="22" y="278" fill="#94a3b8" font-size="10">Worklist Solver, Dead Assignments,</text>
      <text x="22" y="292" fill="#94a3b8" font-size="10">Combinational Loop Detection</text>
    </g>
  </g>

  <!-- Arrow: Col 2 -> Col 3 -->
  <path d="M 490 265 L 535 265" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- ==================== COLUMN 3: DIAGNOSTICS & TRACEABILITY ==================== -->
  <g transform="translate(540, 110)">
    <!-- Stage Header -->
    <rect x="0" y="0" width="200" height="30" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="100" y="20" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">3. BUG DETECTION CATALOG</text>

    <g transform="translate(0, 45)" filter="url(#shadow)">
      <rect x="0" y="0" width="200" height="315" rx="8" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2"/>

      <!-- Rule 1 -->
      <rect x="12" y="14" width="176" height="48" rx="6" fill="#1e1035" stroke="#6b21a8" stroke-width="0.8"/>
      <text x="22" y="32" fill="#f43f5e" font-size="11" font-weight="700">⚠ Unintended Latches</text>
      <text x="22" y="48" fill="#e9d5ff" font-size="10">Incomplete if-else &amp; case branches</text>

      <!-- Rule 2 -->
      <rect x="12" y="70" width="176" height="48" rx="6" fill="#1e1035" stroke="#6b21a8" stroke-width="0.8"/>
      <text x="22" y="88" fill="#fbbf24" font-size="11" font-weight="700">⚠ Width Mismatch</text>
      <text x="22" y="104" fill="#e9d5ff" font-size="10">Implicit truncation &amp; sign extend</text>

      <!-- Rule 3 -->
      <rect x="12" y="126" width="176" height="48" rx="6" fill="#1e1035" stroke="#6b21a8" stroke-width="0.8"/>
      <text x="22" y="144" fill="#fb923c" font-size="11" font-weight="700">⚠ Incomplete FSM States</text>
      <text x="22" y="160" fill="#e9d5ff" font-size="10">Unreachable/unhandled transitions</text>

      <!-- Rule 4 -->
      <rect x="12" y="182" width="176" height="48" rx="6" fill="#1e1035" stroke="#6b21a8" stroke-width="0.8"/>
      <text x="22" y="200" fill="#e879f9" font-size="11" font-weight="700">⚠ Multiple Drivers / Floating</text>
      <text x="22" y="216" fill="#e9d5ff" font-size="10">Bus conflicts &amp; unassigned ports</text>

      <!-- Traceability -->
      <rect x="12" y="238" width="176" height="64" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="22" y="258" fill="#38bdf8" font-size="11" font-weight="700">Spec Traceability Matrix</text>
      <text x="22" y="274" fill="#94a3b8" font-size="10">Maps design blocks to formal</text>
      <text x="22" y="288" fill="#94a3b8" font-size="10">spec requirements (PASS/GAP)</text>
    </g>
  </g>

  <!-- Arrow: Col 3 -> Col 4 -->
  <path d="M 740 265 L 785 265" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- ==================== COLUMN 4: GROUNDED AI & SIMULATION LOOP ==================== -->
  <g transform="translate(790, 110)">
    <!-- Stage Header -->
    <rect x="0" y="0" width="200" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="100" y="20" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">4. AI REPAIR &amp; SIMULATION</text>

    <g transform="translate(0, 45)" filter="url(#shadow)">
      <rect x="0" y="0" width="200" height="315" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2"/>

      <!-- Grounded Evidence Box -->
      <rect x="12" y="14" width="176" height="62" rx="6" fill="#06281e" stroke="#047857" stroke-width="1"/>
      <text x="22" y="34" fill="#34d399" font-size="12" font-weight="700">Grounded Evidence</text>
      <text x="22" y="52" fill="#a7f3d0" font-size="10">Zero Hallucination Constraint</text>
      <text x="22" y="66" fill="#6ee7b7" font-size="9">AST nodes + Diagnostic Tokens only</text>

      <!-- LLM Auto-Fix Engine -->
      <rect x="12" y="88" width="176" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="22" y="108" fill="#38bdf8" font-size="12" font-weight="700">Kiwi AI Fix Generator</text>
      <text x="22" y="126" fill="#94a3b8" font-size="10">Synthesizes patch candidate +</text>
      <text x="22" y="140" fill="#94a3b8" font-size="10">explanation &amp; line-by-line diff</text>

      <!-- Simulation Validator -->
      <rect x="12" y="164" width="176" height="64" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1"/>
      <text x="22" y="184" fill="#34d399" font-size="12" font-weight="700">Simulation Validator</text>
      <text x="22" y="202" fill="#94a3b8" font-size="10">QuestaSim / Vivado / Icarus</text>
      <text x="22" y="216" fill="#94a3b8" font-size="10">Executes regression against TB</text>

      <!-- Feedback / Retry Banner -->
      <rect x="12" y="240" width="176" height="62" rx="6" fill="#311905" stroke="#b45309" stroke-width="1"/>
      <text x="22" y="260" fill="#fbbf24" font-size="11" font-weight="700">Closed-Loop Retry Loop</text>
      <text x="22" y="278" fill="#fde68a" font-size="10">If sim fails ➔ failure log fed back</text>
      <text x="22" y="292" fill="#fde68a" font-size="10">to Kiwi for iterative refinement</text>
    </g>
  </g>

  <!-- Arrow: Col 4 -> Workstation (Bottom) -->
  <path d="M 990 265 L 1030 265 L 1030 450 L 600 450" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>

  <!-- ==================== STAGE 5: INTERACTIVE WORKSTATION ==================== -->
  <g transform="translate(60, 485)" filter="url(#shadow)">
    <!-- Workstation Container -->
    <rect x="0" y="0" width="1080" height="150" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Workstation Header -->
    <rect x="0" y="0" width="1080" height="34" rx="10" fill="#1e293b"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="5" fill="#10b981"/>
    <text x="75" y="22" fill="#f8fafc" font-size="13" font-weight="700" letter-spacing="0.5">5. RIVA VERIFICATION WORKSTATION (REACT 19 + VITE + TAILWIND)</text>
    <rect x="940" y="6" width="120" height="22" rx="11" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="1000" y="21" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Live Cockpit</text>

    <!-- Panel 1: Code & Diff Editor -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="240" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="700">RTL &amp; Spec Editor</text>
      <text x="15" y="44" fill="#94a3b8" font-size="11">Monaco / Ace Editor</text>
      <text x="15" y="62" fill="#64748b" font-size="10">Real-time inline error squiggles,</text>
      <text x="15" y="75" fill="#64748b" font-size="10">one-click patch acceptance diff</text>
    </g>

    <!-- Panel 2: Diagnostics & Audit -->
    <g transform="translate(280, 48)">
      <rect x="0" y="0" width="240" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" fill="#a855f7" font-size="12" font-weight="700">Diagnostic Inspector</text>
      <text x="15" y="44" fill="#94a3b8" font-size="11">Severity &amp; Category Filters</text>
      <text x="15" y="62" fill="#64748b" font-size="10">Error root-cause explanation,</text>
      <text x="15" y="75" fill="#64748b" font-size="10">AST node location &amp; rule codes</text>
    </g>

    <!-- Panel 3: Waveform Viewer -->
    <g transform="translate(540, 48)">
      <rect x="0" y="0" width="240" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" fill="#10b981" font-size="12" font-weight="700">Waveform Panel</text>
      <text x="15" y="44" fill="#94a3b8" font-size="11">VCD Timing &amp; Clock Canvas</text>
      <text x="15" y="62" fill="#64748b" font-size="10">Time markers, transitions, zoom,</text>
      <text x="15" y="75" fill="#64748b" font-size="10">bus hexadecimal/binary views</text>
    </g>

    <!-- Panel 4: Kiwi AI Assistant -->
    <g transform="translate(800, 48)">
      <rect x="0" y="0" width="260" height="85" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="700">Kiwi AI Co-Pilot</text>
      <text x="15" y="44" fill="#94a3b8" font-size="11">Conversational RTL Specialist</text>
      <text x="15" y="62" fill="#64748b" font-size="10">Interactive Q&amp;A on verification gaps,</text>
      <text x="15" y="75" fill="#64748b" font-size="10">synthesis warnings &amp; fix advice</text>
    </g>
  </g>
</svg>