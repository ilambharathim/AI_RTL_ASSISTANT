<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" style="background:#0b0f19; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="blueBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="emeraldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>

    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#0b0f19"/>

  <!-- Title Badge -->
  <g transform="translate(150, 25)">
    <rect x="0" y="0" width="600" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="300" y="25" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">RIVA CLOSED-LOOP BUG DETECTION &amp; AUTO-FIX PIPELINE</text>
  </g>

  <!-- Step 1: Input RTL -->
  <g transform="translate(275, 85)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="350" height="52" rx="10" fill="url(#blueBox)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="175" y="32" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Input Verilog / SystemVerilog RTL</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 450 137 L 450 162" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Static Checks + Bug Classifier -->
  <g transform="translate(275, 165)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="350" height="56" rx="10" fill="url(#blueBox)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="175" y="26" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Static AST / Rule Engine + Bug Classifier</text>
    <text x="175" y="44" fill="#93c5fd" font-size="11" text-anchor="middle">(Latches, Width Mismatch, Incomplete FSMs, Multi-Drivers)</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 450 221 L 450 246" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: LLM Generates Candidate Fix -->
  <g transform="translate(275, 249)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="350" height="56" rx="10" fill="url(#purpleBox)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="175" y="26" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Grounded LLM Generates Candidate Fix</text>
    <text x="175" y="44" fill="#e9d5ff" font-size="11" text-anchor="middle">RTL-specific prompts + contextual AST diagnostics</text>
  </g>

  <!-- Connector 3 -->
  <path d="M 450 305 L 450 330" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Apply Patch to RTL -->
  <g transform="translate(275, 333)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="350" height="52" rx="10" fill="url(#blueBox)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="175" y="32" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Apply Semantic Patch to RTL Code</text>
  </g>

  <!-- Connector 4 -->
  <path d="M 450 385 L 450 410" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Simulation Regression -->
  <g transform="translate(275, 413)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="350" height="56" rx="10" fill="url(#amberBox)" stroke="#f97316" stroke-width="1.5"/>
    <text x="175" y="26" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Re-run Simulation Harness</text>
    <text x="175" y="44" fill="#fed7aa" font-size="11" text-anchor="middle">QuestaSim / Vivado / Icarus Verilog Regression</text>
  </g>

  <!-- Connector 5 -->
  <path d="M 450 469 L 450 494" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 6: Pass Output -->
  <g transform="translate(275, 497)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="350" height="54" rx="10" fill="url(#emeraldBox)" stroke="#10b981" stroke-width="1.5"/>
    <text x="175" y="25" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle">PASS ?</text>
    <text x="175" y="43" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Output Verified RTL &amp; Audit Report</text>
  </g>

  <!-- Feedback Retry Loop (Left side curved path) -->
  <g>
    <!-- Out from step 5 left side -->
    <path d="M 275 441 L 180 441 L 180 277 L 270 277" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
    
    <!-- Retry Note Box -->
    <rect x="50" y="325" width="115" height="65" rx="6" fill="#2d1215" stroke="#ef4444" stroke-width="1"/>
    <text x="107" y="345" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">Simulation Fails?</text>
    <text x="107" y="362" fill="#f87171" font-size="10" text-anchor="middle">Feedback error trace</text>
    <text x="107" y="377" fill="#f87171" font-size="10" text-anchor="middle">to LLM for refinement</text>
  </g>
</svg>